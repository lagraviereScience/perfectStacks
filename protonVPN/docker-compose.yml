services:
  gluetun-vpn:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-vpn

    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - PRIVATE_NETWORK

    environment:
      - TZ=Europe/Paris
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard

      # Enable VPN port forwarding
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn

      # Local network access rule
      - FIREWALL_OUTBOUND_SUBNETS=LOCAL_SUBNET
      - FIREWALL_INPUT_PORTS=9091

      # Gluetun internal control port
      - HTTP_CONTROL_SERVER=on
      - HTTP_CONTROL_SERVER_PORT=9999

      # Port forwarding automation
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c "sleep 10 && apk add --no-cache transmission-remote && transmission-remote localhost:9091 -n 'TRANSMISSION_USER:TRANSMISSION_PASSWORD' -p {{PORTS}} && transmission-remote localhost:9091 -n 'TRANSMISSION_USER:TRANSMISSION_PASSWORD' -t all --reannounce"

    volumes:
      # ProtonVPN WireGuard configuration
      - /PATH/TO/wg0.conf:/gluetun/wireguard/wg0.conf:ro
      - gluetun-vpn-state:/gluetun

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=PRIVATE_NETWORK"
      - "traefik.http.routers.transmission-vpn.rule=Host(`TRANSMISSION_DOMAIN`)"
      - "traefik.http.routers.transmission-vpn.entrypoints=websecure"
      - "traefik.http.routers.transmission-vpn.tls.certresolver=TRAEFIK_CERT_RESOLVER"
      - "traefik.http.services.transmission-vpn.loadbalancer.server.port=9091"

    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9999"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  transmission-vpn:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission-vpn
    cpuset: "2-3"
    restart: unless-stopped

    # Share Gluetun's network namespace
    network_mode: "service:gluetun-vpn"

    depends_on:
      gluetun-vpn:
        condition: service_healthy

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - USER=TRANSMISSION_USER
      - PASS=TRANSMISSION_PASSWORD

    volumes:
      # Transmission configuration
      - /PATH/TO/transmission-config:/config

      # Download directories
      - /PATH/TO/downloads/transmission/completed:/downloads/completed
      - /PATH/TO/data/audio:/downloads/completed/audio
      - /PATH/TO/data/audiobooks:/downloads/completed/audiobooks
      - /PATH/TO/data/books:/downloads/completed/books
      - /PATH/TO/data/games:/downloads/completed/games
      - /PATH/TO/data/new:/downloads/completed/new
      - /PATH/TO/data/old:/downloads/completed/old
      - /PATH/TO/data/softs:/downloads/completed/softs
      - /PATH/TO/data/private-category:/downloads/completed/private-category
      - /PATH/TO/data/series:/downloads/completed/series
      - /PATH/TO/data/reality:/downloads/completed/reality
      - /PATH/TO/downloads/transmission/incomplete:/downloads/incomplete
      - /PATH/TO/downloads/transmission/torrents:/downloads/torrents
      - /PATH/TO/downloads/transmission/watch:/watch

networks:
  PRIVATE_NETWORK:
    external: true

volumes:
  # Persistent Gluetun state
  gluetun-vpn-state:
