services:
  gluetun-proton:
    image: qmcgaw/gluetun:latest
    container_name: gluetun-proton
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
    networks:
      - private_secured_network

    environment:
      - TZ=Europe/Paris
      - VPN_SERVICE_PROVIDER=custom
      - VPN_TYPE=wireguard
      
      # Enable ProtonVPN Port Forwarding via NAT-PMP natively inside Gluetun
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      
      # Local network access rule (adjust if your local subnet is different)
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
      - FIREWALL_INPUT_PORTS=9091

      # Gluetun internal control port
      - HTTP_CONTROL_SERVER=on
      - HTTP_CONTROL_SERVER_PORT=9999

      # AUTOMATION HOOK: Works identically on localhost since network namespaces are shared
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c "sleep 10 && apk add --no-cache transmission-remote && transmission-remote localhost:9091 -n YOUR_RPC_USERNAME:YOUR_RPC_PASSWORD -p {{PORTS}} && transmission-remote localhost:9091 -n YOUR_RPC_USERNAME:YOUR_RPC_PASSWORD -t all --reannounce"

    volumes:
      # Mount your ProtonVPN Wireguard config file directly to Gluetun
      - /path/to/your/apps/vpnProton/wg0.conf:/gluetun/wireguard/wg0.conf:ro
      - gluetun-proton-state:/gluetun

    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=private_secured_network"
      # Isolated Traefik Router & Service names to prevent collision with your other stack
      - "traefik.http.routers.transmission-proton.rule=Host(`your.domain.com`)"
      - "traefik.http.routers.transmission-proton.entrypoints=websecure"
      - "traefik.http.routers.transmission-proton.tls.certresolver=myresolver"
      - "traefik.http.services.transmission-proton.loadbalancer.server.port=9091"

    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9999"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  transmission-proton:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission-proton
    restart: unless-stopped

    # Route traffic through the newly renamed Gluetun service
    network_mode: "service:gluetun-proton"

    depends_on:
      gluetun-proton:
        condition: service_healthy

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - USER=YOUR_RPC_USERNAME
      - PASS=YOUR_RPC_PASSWORD

    volumes:
      # Centralized application configs under your target directory
      - /path/to/your/apps/vpnProton/transmission-config:/config
      # Your persistent download directories
      - /path/to/your/storage/downloads/completed:/downloads/completed
      - /path/to/your/storage/downloads/incomplete:/downloads/incomplete
      - /path/to/your/storage/downloads/torrents:/downloads/torrents
      - /path/to/your/storage/downloads/watch:/watch

networks:
  private_secured_network:
    external: true

volumes:
  # Isolated named volume to prevent writing over your existing stack's state
  gluetun-proton-state:
